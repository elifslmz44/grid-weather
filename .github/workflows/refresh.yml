name: Weekly data refresh

# Keeps the live site current instead of a frozen snapshot: every Monday this re-pulls the
# latest NESO demand and Open-Meteo weather, reruns the whole analysis, runs the tests, and
# commits the refreshed results. GitHub Pages (Deploy from branch -> /docs) then republishes
# automatically because docs/data.js has changed. Run it any time from the Actions tab too.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write           # allow committing the refreshed data back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Run the full pipeline
        run: |
          python -m src.ingest_neso
          python -m src.ingest_weather
          python -m src.clean
          python -m src.signal_analysis
          python -m src.modelling
          python -m src.evaluation
          python -m src.forecast
          python -m src.warehouse
          python -m src.build_site

      - name: Commit refreshed results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/web_data outputs/model_results docs/data.js
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
